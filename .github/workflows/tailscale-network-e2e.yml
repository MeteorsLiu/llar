name: Tailscale Network E2E

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/actions-private-network

permissions:
  contents: read

concurrency:
  group: tailscale-network-e2e
  cancel-in-progress: false

jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        id: [1, 2]
    steps:
      - name: Join private network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:llar-ci
          hostname: llar-${{ github.run_id }}-${{ github.run_attempt }}-worker-${{ matrix.id }}

      - name: Serve worker
        env:
          WORKER_ID: worker-${{ matrix.id }}
        run: |
          python3 - <<'PY'
          import os
          import threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  print(format % args, flush=True)

              def do_GET(self):
                  body = os.environ["WORKER_ID"].encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
                  if self.path == "/shutdown":
                      threading.Thread(target=self.server.shutdown, daemon=True).start()

          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY

  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_1: llar-${{ github.run_id }}-${{ github.run_attempt }}-worker-1
      WORKER_2: llar-${{ github.run_id }}-${{ github.run_attempt }}-worker-2
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Join private network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:llar-ci
          hostname: llar-${{ github.run_id }}-${{ github.run_attempt }}-nginx
          ping: llar-${{ github.run_id }}-${{ github.run_attempt }}-worker-1,llar-${{ github.run_id }}-${{ github.run_attempt }}-worker-2

      - name: Wait for workers
        run: |
          for worker in "$WORKER_1" "$WORKER_2"; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --connect-timeout 2 "http://$worker:8080/health"; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "$worker did not become ready" >&2
                exit 1
              fi
              sleep 1
            done
          done

      - name: Install nginx
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext-base nginx

      - name: Start nginx
        env:
          NGINX_PID: ${{ runner.temp }}/llar-nginx.pid
        run: |
          mkdir -p "$RUNNER_TEMP/nginx"
          envsubst '${WORKER_1} ${WORKER_2} ${NGINX_PID}' \
            < testdata/tailscale-network-e2e/nginx.conf \
            > "$RUNNER_TEMP/nginx.conf"
          nginx -t -c "$RUNNER_TEMP/nginx.conf" -p "$RUNNER_TEMP/nginx"
          nginx -c "$RUNNER_TEMP/nginx.conf" -p "$RUNNER_TEMP/nginx"

      - name: Verify hash routing
        run: |
          first=$(curl --fail --silent --show-error http://127.0.0.1:18080/same-request)
          for attempt in $(seq 1 5); do
            got=$(curl --fail --silent --show-error http://127.0.0.1:18080/same-request)
            test "$got" = "$first"
          done

          for key in $(seq 1 64); do
            curl --fail --silent --show-error "http://127.0.0.1:18080/request-$key"
            printf '\n'
          done | sort -u > "$RUNNER_TEMP/workers"

          grep --fixed-strings --line-regexp worker-1 "$RUNNER_TEMP/workers"
          grep --fixed-strings --line-regexp worker-2 "$RUNNER_TEMP/workers"
          test "$(wc -l < "$RUNNER_TEMP/workers" | tr -d ' ')" -eq 2

      - name: Stop workers and nginx
        if: always()
        run: |
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 "http://$WORKER_1:8080/shutdown" || true
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 "http://$WORKER_2:8080/shutdown" || true
          if [ -f "$RUNNER_TEMP/llar-nginx.pid" ]; then
            kill "$(<"$RUNNER_TEMP/llar-nginx.pid")" || true
          fi
