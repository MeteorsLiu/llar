name: Cross Compile E2E

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: crosscompile-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Install LLVM and the arm64 runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu rpm2cpio cpio
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Prepare glibc 2.17 arm64 sysroot
        run: |
          package_dir="$RUNNER_TEMP/glibc-packages"
          sysroot_dir="$RUNNER_TEMP/glibc-sysroot"
          base_url="https://vault.centos.org/altarch/7.9.2009/os/aarch64/Packages"
          mkdir -p "$package_dir" "$sysroot_dir"

          for package in \
            glibc-2.17-317.el7.aarch64.rpm \
            glibc-devel-2.17-317.el7.aarch64.rpm \
            glibc-headers-2.17-317.el7.aarch64.rpm \
            kernel-headers-4.18.0-193.28.1.el7.aarch64.rpm
          do
            curl --fail --location --retry 3 \
              "$base_url/$package" \
              --output "$package_dir/$package"
          done

          cd "$package_dir"
          sha256sum --check <<'EOF'
          ca1976545bcd4a6c099f1b3e2505469083b6bb4901d2517275a8da4138c0b21a  glibc-2.17-317.el7.aarch64.rpm
          458738f7b415fb73473725b6bef340234954e4eb00731cbf8aa1afad5ccd12f6  glibc-devel-2.17-317.el7.aarch64.rpm
          58a5802d026435b36d7080ea4943868a82fc41642a2b0e475239bd6aaa5882cd  glibc-headers-2.17-317.el7.aarch64.rpm
          56fffc40800cd7c30830009c860f04c8dba1110a6271efd804a0bb01e0bdf8a4  kernel-headers-4.18.0-193.28.1.el7.aarch64.rpm
          EOF
          for package in *.rpm; do
            rpm2cpio "$package" | (cd "$sysroot_dir" && cpio -idm --quiet)
          done
          echo "LLAR_E2E_SYSROOT=$sysroot_dir" >> "$GITHUB_ENV"

      - name: Prepare formula and source repositories
        run: |
          formula_repo="$RUNNER_TEMP/llarhub"
          source_repo="$RUNNER_TEMP/glibc-source"

          mkdir -p "$formula_repo" "$source_repo"
          cp -R testdata/kodo-e2e/formulas/. "$formula_repo/"
          cp -R testdata/crosscompile-e2e/formulas/. "$formula_repo/"
          git -C "$formula_repo" init --initial-branch=main
          git -C "$formula_repo" config user.email crosscompile-e2e@example.com
          git -C "$formula_repo" config user.name "Cross Compile E2E"
          git -C "$formula_repo" add .
          git -C "$formula_repo" commit --quiet -m "Cross compile E2E formulas"

          cp testdata/crosscompile-e2e/install-sysroot "$source_repo/"
          chmod +x "$source_repo/install-sysroot"
          git -C "$source_repo" init --initial-branch=main
          git -C "$source_repo" config user.email crosscompile-e2e@example.com
          git -C "$source_repo" config user.name "Cross Compile E2E"
          git -C "$source_repo" add .
          git -C "$source_repo" commit --quiet -m "Add sysroot installer"
          git -C "$source_repo" tag glibc-2.17

          git config --global protocol.file.allow always
          git config --global url."file://$formula_repo".insteadOf "https://github.com/goplus/llarhub.git"
          git config --global url."file://$source_repo".insteadOf "https://github.com/bminor/glibc.git"

      - name: Cross compile zlib
        run: |
          go build -ldflags="-checklinkname=0" -o "$RUNNER_TEMP/llar" ./cmd/llar
          "$RUNNER_TEMP/llar" make madler/zlib@v1.3.1 \
            --os linux \
            --arch arm64 \
            --output "$RUNNER_TEMP/zlib-linux-arm64" \
            --verbose

      - name: Upload zlib artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-arm64
          path: ${{ runner.temp }}/zlib-linux-arm64
          if-no-files-found: error

  run-linux-arm64:
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download zlib artifact
        uses: actions/download-artifact@v4
        with:
          name: zlib-linux-arm64
          path: ${{ runner.temp }}/zlib-linux-arm64

      - name: Build and run consumer
        run: |
          test "$(uname -m)" = "aarch64"
          cc \
            -I"$RUNNER_TEMP/zlib-linux-arm64/include" \
            testdata/crosscompile-e2e/consumer.c \
            "$RUNNER_TEMP/zlib-linux-arm64/lib/libz.a" \
            -o "$RUNNER_TEMP/zlib-consumer"
          file "$RUNNER_TEMP/zlib-consumer"
          "$RUNNER_TEMP/zlib-consumer"

  build-darwin-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Prepare macOS 14.5 SDK
        run: |
          archive="$RUNNER_TEMP/MacOSX14.5.sdk.tar.xz"
          sdk_root="$RUNNER_TEMP/macos-sdk"
          curl --fail --location --retry 3 \
            "https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz" \
            --output "$archive"
          echo "6e146275d19f027faa2e8354da5e0267513abf013b8f16ad65a231653a2b1c5d  $archive" | sha256sum --check
          mkdir -p "$sdk_root"
          tar -xJf "$archive" -C "$sdk_root"
          echo "LLAR_E2E_SYSROOT=$sdk_root/MacOSX14.5.sdk" >> "$GITHUB_ENV"

      - name: Prepare formula and source repositories
        run: |
          formula_repo="$RUNNER_TEMP/llarhub"
          source_repo="$RUNNER_TEMP/macosx-sdks-source"

          mkdir -p "$formula_repo" "$source_repo"
          cp -R testdata/kodo-e2e/formulas/. "$formula_repo/"
          cp -R testdata/crosscompile-e2e/formulas/. "$formula_repo/"
          git -C "$formula_repo" init --initial-branch=main
          git -C "$formula_repo" config user.email crosscompile-e2e@example.com
          git -C "$formula_repo" config user.name "Cross Compile E2E"
          git -C "$formula_repo" add .
          git -C "$formula_repo" commit --quiet -m "Cross compile E2E formulas"

          cp testdata/crosscompile-e2e/install-sysroot "$source_repo/"
          chmod +x "$source_repo/install-sysroot"
          git -C "$source_repo" init --initial-branch=main
          git -C "$source_repo" config user.email crosscompile-e2e@example.com
          git -C "$source_repo" config user.name "Cross Compile E2E"
          git -C "$source_repo" add .
          git -C "$source_repo" commit --quiet -m "Add sysroot installer"
          git -C "$source_repo" tag 14.5

          git config --global protocol.file.allow always
          git config --global url."file://$formula_repo".insteadOf "https://github.com/goplus/llarhub.git"
          git config --global url."file://$source_repo".insteadOf "https://github.com/joseluisq/macosx-sdks.git"

      - name: Cross compile zlib
        run: |
          go build -ldflags="-checklinkname=0" -o "$RUNNER_TEMP/llar" ./cmd/llar
          "$RUNNER_TEMP/llar" make madler/zlib@v1.3.1 \
            --os darwin \
            --arch arm64 \
            --output "$RUNNER_TEMP/zlib-darwin-arm64" \
            --verbose

      - name: Upload zlib artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlib-darwin-arm64
          path: ${{ runner.temp }}/zlib-darwin-arm64
          if-no-files-found: error

  run-darwin-arm64:
    needs: build-darwin-arm64
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download zlib artifact
        uses: actions/download-artifact@v4
        with:
          name: zlib-darwin-arm64
          path: ${{ runner.temp }}/zlib-darwin-arm64

      - name: Build and run consumer
        run: |
          test "$(uname -m)" = "arm64"
          cc \
            -I"$RUNNER_TEMP/zlib-darwin-arm64/include" \
            testdata/crosscompile-e2e/consumer.c \
            "$RUNNER_TEMP/zlib-darwin-arm64/lib/libz.a" \
            -o "$RUNNER_TEMP/zlib-consumer"
          file "$RUNNER_TEMP/zlib-consumer"
          "$RUNNER_TEMP/zlib-consumer"
