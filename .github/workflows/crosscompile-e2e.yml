name: Cross Compile E2E (Linux hosts to arm64 targets)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: crosscompile-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-arm64:
    name: "Build zlib: Linux amd64 host to Linux arm64 target"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Prepare Bootlin glibc 2.24 arm64 sysroot
        run: |
          archive="$RUNNER_TEMP/aarch64--glibc--stable-2017.05-toolchains-1-1.tar.bz2"
          toolchain_root="$RUNNER_TEMP/bootlin"
          curl --fail --location --retry 3 \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-2017.05-toolchains-1-1.tar.bz2" \
            --output "$archive"
          echo "530137589c4588599ebd115c12630c75e79c935ac4f34b0941404036f5e25026  $archive" | sha256sum --check
          mkdir -p "$toolchain_root"
          tar -xjf "$archive" -C "$toolchain_root"

          root="$toolchain_root/aarch64--glibc--stable"
          sysroot="$root/aarch64-buildroot-linux-gnu/sysroot"
          gcc_runtime="$root/lib/gcc/aarch64-buildroot-linux-gnu/5.4.0"
          # Clang receives only the sysroot path, so install Bootlin's target
          # runtime, for example crtbeginS.o and libgcc.a, into its library path.
          cp -a "$gcc_runtime/." "$sysroot/usr/lib/"

      - name: Prepare formula and source repositories
        run: |
          formula_repo="$RUNNER_TEMP/llarhub"
          source_repo="$RUNNER_TEMP/glibc-source"

          mkdir -p "$formula_repo" "$source_repo"
          cp -R testdata/kodo-e2e/formulas/. "$formula_repo/"
          cp -R testdata/crosscompile-e2e/formulas/. "$formula_repo/"
          git -C "$formula_repo" init --initial-branch=main
          git -C "$formula_repo" config user.email crosscompile-e2e@example.com
          git -C "$formula_repo" config user.name "Cross Compile E2E"
          git -C "$formula_repo" add .
          git -C "$formula_repo" commit --quiet -m "Cross compile E2E formulas"

          cp testdata/crosscompile-e2e/install-sysroot "$source_repo/"
          tar -cJf "$source_repo/sysroot.tar.xz" \
            -C "$RUNNER_TEMP/bootlin/aarch64--glibc--stable/aarch64-buildroot-linux-gnu/sysroot" .
          chmod +x "$source_repo/install-sysroot"
          git -C "$source_repo" init --initial-branch=main
          git -C "$source_repo" config user.email crosscompile-e2e@example.com
          git -C "$source_repo" config user.name "Cross Compile E2E"
          git -C "$source_repo" add .
          git -C "$source_repo" commit --quiet -m "Add sysroot installer"
          git -C "$source_repo" tag glibc-2.24

          git config --global protocol.file.allow always
          git config --global url."file://$formula_repo".insteadOf "https://github.com/goplus/llarhub.git"
          git config --global url."file://$source_repo".insteadOf "https://github.com/bminor/glibc.git"

      - name: Cross compile zlib
        run: |
          go build -ldflags="-checklinkname=0" -o "$RUNNER_TEMP/llar" ./cmd/llar
          "$RUNNER_TEMP/llar" make madler/zlib@v1.3.1 \
            --os linux \
            --arch arm64 \
            --output "$RUNNER_TEMP/zlib-linux-arm64" \
            --verbose

      - name: Upload zlib artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-arm64
          path: ${{ runner.temp }}/zlib-linux-arm64
          if-no-files-found: error

  run-linux-arm64:
    name: "Run zlib: Linux arm64 runner consumes Linux arm64 artifact"
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download zlib artifact
        uses: actions/download-artifact@v4
        with:
          name: zlib-linux-arm64
          path: ${{ runner.temp }}/zlib-linux-arm64

      - name: Inspect, link, and run consumer
        run: |
          lib="$RUNNER_TEMP/zlib-linux-arm64/lib/libz.a"
          member_dir="$RUNNER_TEMP/zlib-members"
          consumer="$RUNNER_TEMP/zlib-consumer"

          mkdir -p "$member_dir"
          (
            cd "$member_dir"
            ar x "$lib" adler32.o
          )
          file "$member_dir/adler32.o" | tee "$RUNNER_TEMP/zlib-format.txt"
          grep -F "ELF 64-bit LSB relocatable, ARM aarch64" "$RUNNER_TEMP/zlib-format.txt"

          cc \
            -I"$RUNNER_TEMP/zlib-linux-arm64/include" \
            testdata/crosscompile-e2e/consumer.c \
            "$lib" \
            -o "$consumer"
          ldd "$consumer" | tee "$RUNNER_TEMP/dynamic-libraries.txt"
          grep -E "libc\\.so\\.6 => /" "$RUNNER_TEMP/dynamic-libraries.txt"
          "$consumer"

  build-darwin-arm64:
    name: "Build zlib: Linux amd64 host to Darwin arm64 target"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Prepare macOS 14.5 SDK
        run: |
          archive="$RUNNER_TEMP/MacOSX14.5.sdk.tar.xz"
          curl --fail --location --retry 3 \
            "https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz" \
            --output "$archive"
          echo "6e146275d19f027faa2e8354da5e0267513abf013b8f16ad65a231653a2b1c5d  $archive" | sha256sum --check

      - name: Prepare formula and source repositories
        run: |
          formula_repo="$RUNNER_TEMP/llarhub"
          source_repo="$RUNNER_TEMP/macosx-sdks-source"

          mkdir -p "$formula_repo" "$source_repo"
          cp -R testdata/kodo-e2e/formulas/. "$formula_repo/"
          cp -R testdata/crosscompile-e2e/formulas/. "$formula_repo/"
          git -C "$formula_repo" init --initial-branch=main
          git -C "$formula_repo" config user.email crosscompile-e2e@example.com
          git -C "$formula_repo" config user.name "Cross Compile E2E"
          git -C "$formula_repo" add .
          git -C "$formula_repo" commit --quiet -m "Cross compile E2E formulas"

          cp testdata/crosscompile-e2e/install-sysroot "$source_repo/"
          cp "$RUNNER_TEMP/MacOSX14.5.sdk.tar.xz" "$source_repo/sysroot.tar.xz"
          chmod +x "$source_repo/install-sysroot"
          git -C "$source_repo" init --initial-branch=main
          git -C "$source_repo" config user.email crosscompile-e2e@example.com
          git -C "$source_repo" config user.name "Cross Compile E2E"
          git -C "$source_repo" add .
          git -C "$source_repo" commit --quiet -m "Add sysroot installer"
          git -C "$source_repo" tag 14.5

          git config --global protocol.file.allow always
          git config --global url."file://$formula_repo".insteadOf "https://github.com/goplus/llarhub.git"
          git config --global url."file://$source_repo".insteadOf "https://github.com/joseluisq/macosx-sdks.git"

      - name: Cross compile zlib
        run: |
          go build -ldflags="-checklinkname=0" -o "$RUNNER_TEMP/llar" ./cmd/llar
          "$RUNNER_TEMP/llar" make madler/zlib@v1.3.1 \
            --os darwin \
            --arch arm64 \
            --output "$RUNNER_TEMP/zlib-darwin-arm64" \
            --verbose

      - name: Upload zlib artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlib-darwin-arm64
          path: ${{ runner.temp }}/zlib-darwin-arm64
          if-no-files-found: error

  run-darwin-arm64:
    name: "Run zlib: macOS arm64 runner consumes Darwin arm64 artifact"
    needs: build-darwin-arm64
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download zlib artifact
        uses: actions/download-artifact@v4
        with:
          name: zlib-darwin-arm64
          path: ${{ runner.temp }}/zlib-darwin-arm64

      - name: Inspect, link, and run consumer
        run: |
          lib="$RUNNER_TEMP/zlib-darwin-arm64/lib/libz.a"
          consumer="$RUNNER_TEMP/zlib-consumer"

          lipo -info "$lib" | tee "$RUNNER_TEMP/zlib-format.txt"
          grep -F "architecture: arm64" "$RUNNER_TEMP/zlib-format.txt"

          cc \
            -I"$RUNNER_TEMP/zlib-darwin-arm64/include" \
            testdata/crosscompile-e2e/consumer.c \
            "$lib" \
            -o "$consumer"
          otool -L "$consumer" | tee "$RUNNER_TEMP/dynamic-libraries.txt"
          grep -F "/usr/lib/libSystem.B.dylib" "$RUNNER_TEMP/dynamic-libraries.txt"
          "$consumer"
