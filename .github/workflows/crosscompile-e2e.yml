name: Cross Compile E2E (Linux hosts to arm64 targets)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: crosscompile-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-arm64:
    name: "Build zlib: Linux amd64 -> Linux arm64 (default/custom libc)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Download Bootlin glibc 2.24 and 2.27 arm64 toolchains
        run: |
          default_archive="$RUNNER_TEMP/aarch64--glibc--stable-2017.05-toolchains-1-1.tar.bz2"
          custom_archive="$RUNNER_TEMP/aarch64--glibc--stable-2018.11-1.tar.bz2"

          curl --fail --location --retry 3 \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-2017.05-toolchains-1-1.tar.bz2" \
            --output "$default_archive"
          curl --fail --location --retry 3 \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-2018.11-1.tar.bz2" \
            --output "$custom_archive"
          echo "530137589c4588599ebd115c12630c75e79c935ac4f34b0941404036f5e25026  $default_archive" | sha256sum --check
          echo "abae0522480b9f37ff6cee4249e147e7cb78e1997cc6f76dba7e0fb8ec04221d  $custom_archive" | sha256sum --check

      - name: Prepare formula and source repositories
        run: |
          formula_repo="$RUNNER_TEMP/llarhub"
          source_repo="$RUNNER_TEMP/glibc-source"

          mkdir -p "$formula_repo" "$source_repo"
          cp -R testdata/kodo-e2e/formulas/. "$formula_repo/"
          cp -R testdata/crosscompile-e2e/formulas/. "$formula_repo/"
          git -C "$formula_repo" init --initial-branch=main
          git -C "$formula_repo" config user.email crosscompile-e2e@example.com
          git -C "$formula_repo" config user.name "Cross Compile E2E"
          git -C "$formula_repo" add .
          git -C "$formula_repo" commit --quiet -m "Cross compile E2E formulas"

          cp testdata/crosscompile-e2e/install-bootlin-sysroot "$source_repo/install-sysroot"
          cp "$RUNNER_TEMP/aarch64--glibc--stable-2017.05-toolchains-1-1.tar.bz2" "$source_repo/"
          chmod +x "$source_repo/install-sysroot"
          git -C "$source_repo" init --initial-branch=main
          git -C "$source_repo" config user.email crosscompile-e2e@example.com
          git -C "$source_repo" config user.name "Cross Compile E2E"
          git -C "$source_repo" add .
          git -C "$source_repo" commit --quiet -m "Add glibc 2.24 toolchain"
          git -C "$source_repo" tag glibc-2.24

          git -C "$source_repo" rm --quiet aarch64--glibc--stable-2017.05-toolchains-1-1.tar.bz2
          cp "$RUNNER_TEMP/aarch64--glibc--stable-2018.11-1.tar.bz2" "$source_repo/"
          git -C "$source_repo" add aarch64--glibc--stable-2018.11-1.tar.bz2
          git -C "$source_repo" commit --quiet -m "Update toolchain to glibc 2.27"
          git -C "$source_repo" tag glibc-2.27

          git config --global protocol.file.allow always
          git config --global url."file://$formula_repo".insteadOf "https://github.com/goplus/llarhub.git"
          git config --global url."file://$source_repo".insteadOf "https://github.com/bminor/glibc.git"

      - name: Cross compile zlib with default sysroot
        run: |
          go build -ldflags="-checklinkname=0" -o "$RUNNER_TEMP/llar" ./cmd/llar
          "$RUNNER_TEMP/llar" make madler/zlib@v1.3.1 \
            --os linux \
            --arch arm64 \
            --output "$RUNNER_TEMP/zlib-linux-arm64" \
            --verbose

      - name: Cross compile zlib with Formula-managed libc
        run: |
          custom_log="$RUNNER_TEMP/zlib-linux-arm64-custom-libc.log"
          "$RUNNER_TEMP/llar" make madler/zlib@v1.3.1 \
            --os linux \
            --arch arm64 \
            --require libc=glibc-2.27 \
            --output "$RUNNER_TEMP/zlib-linux-arm64-custom-libc" \
            --json \
            --verbose \
            > "$RUNNER_TEMP/zlib-linux-arm64-custom-libc.json" \
            2> >(tee "$custom_log" >&2)
          grep -F '"path":"bminor/glibc","version":"glibc-2.27"' \
            "$RUNNER_TEMP/zlib-linux-arm64-custom-libc.json"
          grep -E -- '--sysroot=[^ ]*/bminor/glibc@glibc-2\.27-' "$custom_log"
          if grep -F -- 'bminor/glibc@glibc-2.24-' "$custom_log"; then
            echo "custom libc build used the default glibc 2.24 sysroot" >&2
            exit 1
          fi

      - name: Upload default-sysroot zlib artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-arm64
          path: ${{ runner.temp }}/zlib-linux-arm64
          if-no-files-found: error

      - name: Upload custom-libc zlib artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-arm64-custom-libc
          path: ${{ runner.temp }}/zlib-linux-arm64-custom-libc
          if-no-files-found: error

  run-linux-arm64:
    name: "Run zlib: Linux arm64 (default/custom libc)"
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download default-sysroot zlib artifact
        uses: actions/download-artifact@v4
        with:
          name: zlib-linux-arm64
          path: ${{ runner.temp }}/zlib-linux-arm64

      - name: Download custom-libc zlib artifact
        uses: actions/download-artifact@v4
        with:
          name: zlib-linux-arm64-custom-libc
          path: ${{ runner.temp }}/zlib-linux-arm64-custom-libc

      - name: Inspect, link, and run default-sysroot consumer
        run: |
          lib="$RUNNER_TEMP/zlib-linux-arm64/lib/libz.a"
          member_dir="$RUNNER_TEMP/zlib-members"
          consumer="$RUNNER_TEMP/zlib-consumer"

          mkdir -p "$member_dir"
          (
            cd "$member_dir"
            ar x "$lib" adler32.o
          )
          file "$member_dir/adler32.o" | tee "$RUNNER_TEMP/zlib-format.txt"
          grep -F "ELF 64-bit LSB relocatable, ARM aarch64" "$RUNNER_TEMP/zlib-format.txt"

          cc \
            -I"$RUNNER_TEMP/zlib-linux-arm64/include" \
            testdata/crosscompile-e2e/consumer.c \
            "$lib" \
            -o "$consumer"
          ldd "$consumer" | tee "$RUNNER_TEMP/dynamic-libraries.txt"
          grep -E "libc\\.so\\.6 => /" "$RUNNER_TEMP/dynamic-libraries.txt"
          "$consumer"

      - name: Inspect, link, and run custom-libc consumer
        run: |
          lib="$RUNNER_TEMP/zlib-linux-arm64-custom-libc/lib/libz.a"
          member_dir="$RUNNER_TEMP/zlib-custom-libc-members"
          consumer="$RUNNER_TEMP/zlib-custom-libc-consumer"

          mkdir -p "$member_dir"
          (
            cd "$member_dir"
            ar x "$lib" adler32.o
          )
          file "$member_dir/adler32.o" | tee "$RUNNER_TEMP/zlib-custom-libc-format.txt"
          grep -F "ELF 64-bit LSB relocatable, ARM aarch64" "$RUNNER_TEMP/zlib-custom-libc-format.txt"

          cc \
            -I"$RUNNER_TEMP/zlib-linux-arm64-custom-libc/include" \
            testdata/crosscompile-e2e/consumer.c \
            "$lib" \
            -o "$consumer"
          ldd "$consumer" | tee "$RUNNER_TEMP/custom-libc-dynamic-libraries.txt"
          grep -E "libc\\.so\\.6 => /" "$RUNNER_TEMP/custom-libc-dynamic-libraries.txt"
          "$consumer"

  build-darwin-arm64:
    name: "Build zlib: Linux amd64 host to Darwin arm64 target"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Prepare macOS 14.5 SDK
        run: |
          archive="$RUNNER_TEMP/MacOSX14.5.sdk.tar.xz"
          curl --fail --location --retry 3 \
            "https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz" \
            --output "$archive"
          echo "6e146275d19f027faa2e8354da5e0267513abf013b8f16ad65a231653a2b1c5d  $archive" | sha256sum --check

      - name: Prepare formula and source repositories
        run: |
          formula_repo="$RUNNER_TEMP/llarhub"
          source_repo="$RUNNER_TEMP/macosx-sdks-source"

          mkdir -p "$formula_repo" "$source_repo"
          cp -R testdata/kodo-e2e/formulas/. "$formula_repo/"
          cp -R testdata/crosscompile-e2e/formulas/. "$formula_repo/"
          git -C "$formula_repo" init --initial-branch=main
          git -C "$formula_repo" config user.email crosscompile-e2e@example.com
          git -C "$formula_repo" config user.name "Cross Compile E2E"
          git -C "$formula_repo" add .
          git -C "$formula_repo" commit --quiet -m "Cross compile E2E formulas"

          cp testdata/crosscompile-e2e/install-sysroot "$source_repo/"
          cp "$RUNNER_TEMP/MacOSX14.5.sdk.tar.xz" "$source_repo/sysroot.tar.xz"
          chmod +x "$source_repo/install-sysroot"
          git -C "$source_repo" init --initial-branch=main
          git -C "$source_repo" config user.email crosscompile-e2e@example.com
          git -C "$source_repo" config user.name "Cross Compile E2E"
          git -C "$source_repo" add .
          git -C "$source_repo" commit --quiet -m "Add sysroot installer"
          git -C "$source_repo" tag 14.5

          git config --global protocol.file.allow always
          git config --global url."file://$formula_repo".insteadOf "https://github.com/goplus/llarhub.git"
          git config --global url."file://$source_repo".insteadOf "https://github.com/joseluisq/macosx-sdks.git"

      - name: Cross compile zlib
        run: |
          go build -ldflags="-checklinkname=0" -o "$RUNNER_TEMP/llar" ./cmd/llar
          "$RUNNER_TEMP/llar" make madler/zlib@v1.3.1 \
            --os darwin \
            --arch arm64 \
            --output "$RUNNER_TEMP/zlib-darwin-arm64" \
            --verbose

      - name: Upload zlib artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlib-darwin-arm64
          path: ${{ runner.temp }}/zlib-darwin-arm64
          if-no-files-found: error

  run-darwin-arm64:
    name: "Run zlib: macOS arm64 runner consumes Darwin arm64 artifact"
    needs: build-darwin-arm64
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download zlib artifact
        uses: actions/download-artifact@v4
        with:
          name: zlib-darwin-arm64
          path: ${{ runner.temp }}/zlib-darwin-arm64

      - name: Inspect, link, and run consumer
        run: |
          lib="$RUNNER_TEMP/zlib-darwin-arm64/lib/libz.a"
          consumer="$RUNNER_TEMP/zlib-consumer"

          lipo -info "$lib" | tee "$RUNNER_TEMP/zlib-format.txt"
          grep -F "architecture: arm64" "$RUNNER_TEMP/zlib-format.txt"

          cc \
            -I"$RUNNER_TEMP/zlib-darwin-arm64/include" \
            testdata/crosscompile-e2e/consumer.c \
            "$lib" \
            -o "$consumer"
          otool -L "$consumer" | tee "$RUNNER_TEMP/dynamic-libraries.txt"
          grep -F "/usr/lib/libSystem.B.dylib" "$RUNNER_TEMP/dynamic-libraries.txt"
          "$consumer"
