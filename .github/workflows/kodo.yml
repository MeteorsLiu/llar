name: Kodo E2E

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
      - "!dependabot/**"
      - "!xgopilot/**"
  pull_request_target:
    branches: [ "**" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  kodo:
    name: llar make -> Kodo -> Postgres
    runs-on: ubuntu-latest
    environment: kodo-e2e

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: llar
          POSTGRES_PASSWORD: llar
          POSTGRES_DB: llar_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llar -d llar_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Download Go modules
        run: go mod download

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install LLAR
        run: |
          mkdir -p .bin
          GOBIN="$PWD/.bin" go install -ldflags="-checklinkname=0" ./cmd/llar
          echo "$PWD/.bin" >> "$GITHUB_PATH"

      - name: Check Kodo secrets
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_PUBLIC_DOMAIN: llar.liuxi.ng
        run: |
          test -n "$QINIU_ACCESS_KEY"
          test -n "$QINIU_SECRET_KEY"
          test -n "$QINIU_BUCKET"
          test -n "$QINIU_PUBLIC_DOMAIN"

      - name: Run Kodo E2E
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_PUBLIC_DOMAIN: llar.liuxi.ng
          QINIU_PREFIX: ${{ secrets.QINIU_PREFIX }}
          POSTGRES_DSN: host=localhost port=5432 user=llar password=llar dbname=llar_e2e sslmode=disable
        run: |
          go test -v -ldflags="-checklinkname=0" ./internal/build/cache -run '^TestKodoE2E_' -count=1
          go run -ldflags="-checklinkname=0" ./testdata/kodo-e2e
