name: GHCR Package Seed Experiment

run-name: ghcr-seed-${{ inputs.package }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: GHCR package name to create when it does not exist.
        required: true
        type: string
      tag:
        description: Seed image tag.
        required: false
        default: llar-seed
        type: string
      source_url:
        description: Repository URL for org.opencontainers.image.source.
        required: false
        type: string

concurrency:
  group: ghcr-package-seed-${{ github.repository_owner }}-${{ inputs.package }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize image repository
        id: image
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ github.repository_owner }}/${{ inputs.package }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check seed image
        id: seed
        uses: tyriis/docker-image-tag-exists@v3.0.0
        with:
          registry: ghcr.io
          repository: ${{ steps.image.outputs.lowercase }}
          tag: ${{ inputs.tag }}

      - name: Docker metadata
        id: meta
        if: steps.seed.outputs.tag == 'not found'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.image.outputs.lowercase }}
          tags: type=raw,value=${{ inputs.tag }}

      - name: Set up Docker Buildx
        if: steps.seed.outputs.tag == 'not found'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.seed.outputs.tag == 'not found'
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:.github/ghcr-seed"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SOURCE_URL=${{ inputs.source_url || format('https://github.com/{0}', github.repository) }}
