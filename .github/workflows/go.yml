name: GHCR Package Seed Experiment

run-name: ghcr-seed-${{ inputs.package }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: GHCR package name to create when it does not exist.
        required: true
        type: string
      tag:
        description: Seed image tag.
        required: false
        default: llar-seed
        type: string
      source_url:
        description: Repository URL for org.opencontainers.image.source.
        required: false
        type: string

concurrency:
  group: ghcr-package-seed-${{ github.repository_owner }}-${{ inputs.package }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check package
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ inputs.package }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          package=$(printf '%s' "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')
          encoded_package=$(printf '%s' "$package" | jq -sRr @uri)

          if [ -z "$SOURCE_URL" ]; then
            SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}"
          fi

          echo "image=ghcr.io/${owner}/${package}" >> "$GITHUB_OUTPUT"
          echo "source_url=$SOURCE_URL" >> "$GITHUB_OUTPUT"

          check_package() {
            local endpoint="$1"
            local output="$RUNNER_TEMP/ghcr-package-response.txt"

            set +e
            gh api --include \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$endpoint" >"$output" 2>&1
            local status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "found"
              return 0
            fi
            if grep -Eq "^HTTP/[0-9.]+ 404|HTTP 404" "$output"; then
              echo "missing"
              return 0
            fi

            cat "$output" >&2
            return "$status"
          }

          user_package=$(check_package "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${encoded_package}")
          org_package=$(check_package "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${encoded_package}")

          if [ "$user_package" = "found" ] || [ "$org_package" = "found" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Package ${GITHUB_REPOSITORY_OWNER}/${package} already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Package ${GITHUB_REPOSITORY_OWNER}/${package} does not exist; publishing seed image."
          fi

      - name: Log in to GHCR
        if: steps.seed.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        if: steps.seed.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.seed.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:.github/ghcr-seed"
          push: true
          tags: ${{ steps.seed.outputs.image }}:${{ inputs.tag }}
          build-args: |
            SOURCE_URL=${{ steps.seed.outputs.source_url }}
